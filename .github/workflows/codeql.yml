name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: swift
            os: macos-15-intel
            build-mode: manual
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.language == 'csharp'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: matrix.language == 'csharp'
      - name: Build C# helper for analysis
        if: matrix.language == 'csharp'
        run: npm run native
      - name: Build Swift helper for analysis
        if: matrix.language == 'swift'
        run: >-
          xcrun swiftc -c native/macos/ActiveWindowHelper.swift
          -o "$RUNNER_TEMP/active-window-helper.o"
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
