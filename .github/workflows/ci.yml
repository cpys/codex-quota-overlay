name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: pwsh
        run: ./test.ps1

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./package.ps1 -SkipBuild

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-overlay-windows
          path: artifacts/release/*
          if-no-files-found: error
