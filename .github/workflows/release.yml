name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag mismatch" }
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Test and package
        shell: pwsh
        run: |
          ./test.ps1
          ./package.ps1 -SkipBuild
      - run: npm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            artifacts/release/CodexQuotaOverlay-Windows-Setup-*-x64.exe
            artifacts/release/CodexQuotaOverlay-Windows-Portable-*-x64.zip
            artifacts/release/SHA256SUMS-Windows-*.txt
            artifacts/release/SBOM-*.cdx.json
          if-no-files-found: error

  macos-validation:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run dist:mac
      - name: Verify macOS packages without publishing them
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p "$RUNNER_TEMP/cqo-app"
          test "$(find artifacts/electron -name 'CodexQuotaOverlay-mac-*.dmg' | wc -l | tr -d ' ')" = "2"
          test "$(find artifacts/electron -name 'CodexQuotaOverlay-mac-*.zip' | wc -l | tr -d ' ')" = "2"
          for dmg in artifacts/electron/CodexQuotaOverlay-mac-*.dmg; do hdiutil verify "$dmg"; done
          host_arch="$(uname -m)"
          package_arch="x64"
          test "$host_arch" != "arm64" || package_arch="arm64"
          unzip -q "artifacts/electron/CodexQuotaOverlay-mac-${version}-${package_arch}.zip" -d "$RUNNER_TEMP/cqo-app"
          app_path="$RUNNER_TEMP/cqo-app/CodexQuotaOverlay.app"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          marker="$RUNNER_TEMP/cqo-macos-self-test.json"
          "$app_path/Contents/MacOS/CodexQuotaOverlay" "--self-test=$marker"
          node -e "const r=require(process.argv[1]); if(!r.ok||!r.packaged||r.platform!=='darwin'||r.version!==process.argv[2]) process.exit(1)" "$marker" "$version"

  publish:
    needs: [windows, macos-validation]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release-assets
      - name: Resolve release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publish stable Windows release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 下载 / Downloads

            ### 🪟 Windows 10/11（x64）

            - **推荐 / Recommended:** [安装版 Setup EXE](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CodexQuotaOverlay-Windows-Setup-${{ steps.version.outputs.value }}-x64.exe)
            - [便携版 Portable ZIP](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CodexQuotaOverlay-Windows-Portable-${{ steps.version.outputs.value }}-x64.zip)
            - [Windows SHA-256](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS-Windows-${{ steps.version.outputs.value }}.txt)

            ### 供应链 / Supply chain

            - [CycloneDX SBOM](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SBOM-${{ steps.version.outputs.value }}.cdx.json)
            - GitHub build-provenance attestations are attached to every release asset.

            ## 验证状态 / Validation

            - Windows: physical Windows 11 verification plus packaged and installed CI self-tests.
            - macOS: source compatibility, dual-architecture packages, DMG structure, signature structure, and the host-architecture packaged self-test are validated on GitHub's macOS 14 environment. No macOS assets are distributed in this release.
            - Linux: no package because there is no official Codex Desktop app for Linux.

            > The Windows package is not commercially code-signed. Verify its checksum before opening.
          files: release-assets/*
