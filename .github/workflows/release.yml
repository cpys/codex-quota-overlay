name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag mismatch" }
      - run: npm ci
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Test and package
        shell: pwsh
        run: |
          ./test.ps1
          ./package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/release/CodexQuotaOverlay-Windows-Setup-*-x64.exe
            artifacts/release/CodexQuotaOverlay-Windows-Portable-*-x64.zip
            artifacts/release/SHA256SUMS-Windows-*.txt

  macos:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: npm ci
      - run: npm test
      - run: npm run test:host
      - run: npm run smoke
      - run: npm run dist:mac
      - name: Collect macOS assets
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p artifacts/release-macos
          cp artifacts/electron/CodexQuotaOverlay-mac-*.dmg artifacts/release-macos/
          cp artifacts/electron/CodexQuotaOverlay-mac-*.zip artifacts/release-macos/
          cd artifacts/release-macos
          shasum -a 256 CodexQuotaOverlay-mac-* > "SHA256SUMS-macOS-${version}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: artifacts/release-macos/*

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            Windows is verified on a physical Windows 11 host.
            macOS packages are automated preview builds pending final validation on a physical Mac.
            The macOS build is not notarized; use right-click > Open for this preview.
          files: release-assets/*
