name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag mismatch" }
      - run: npm ci
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Test and package
        shell: pwsh
        run: |
          ./test.ps1
          ./package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/release/CodexQuotaOverlay-Windows-Setup-*-x64.exe
            artifacts/release/CodexQuotaOverlay-Windows-Portable-*-x64.zip
            artifacts/release/SHA256SUMS-Windows-*.txt

  macos:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: npm ci
      - run: npm test
      - run: npm run test:host
      - run: npm run smoke
      - run: npm run dist:mac
      - name: Collect macOS assets
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p artifacts/release-macos
          cp artifacts/electron/CodexQuotaOverlay-mac-*.dmg artifacts/release-macos/
          cp artifacts/electron/CodexQuotaOverlay-mac-*.zip artifacts/release-macos/
          cd artifacts/release-macos
          shasum -a 256 CodexQuotaOverlay-mac-* > "SHA256SUMS-macOS-${version}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: artifacts/release-macos/*

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Resolve release version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            ## 下载 / Downloads

            ### 🪟 Windows 10/11（x64）

            - **推荐 / Recommended:** [安装版 Setup EXE](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CodexQuotaOverlay-Windows-Setup-${{ steps.version.outputs.value }}-x64.exe)
            - [便携版 Portable ZIP](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CodexQuotaOverlay-Windows-Portable-${{ steps.version.outputs.value }}-x64.zip)
            - [Windows SHA-256 校验文件](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS-Windows-${{ steps.version.outputs.value }}.txt)

            ### 🍎 macOS — Apple Silicon（arm64）

            - **推荐 / Recommended:** [DMG 安装包](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CodexQuotaOverlay-mac-${{ steps.version.outputs.value }}-arm64.dmg)
            - [ZIP 压缩包](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CodexQuotaOverlay-mac-${{ steps.version.outputs.value }}-arm64.zip)

            ### 🍎 macOS — Intel（x64）

            - **推荐 / Recommended:** [DMG 安装包](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CodexQuotaOverlay-mac-${{ steps.version.outputs.value }}-x64.dmg)
            - [ZIP 压缩包](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CodexQuotaOverlay-mac-${{ steps.version.outputs.value }}-x64.zip)
            - [macOS SHA-256 校验文件](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS-macOS-${{ steps.version.outputs.value }}.txt)

            ## 验证状态 / Validation

            - Windows: verified on a physical Windows 11 host.
            - macOS: automated preview builds validated on a macOS runner; physical-Mac acceptance is pending.
            - Linux: no package because there is no official Codex Desktop app for Linux.

            > Windows and macOS preview builds are not commercially code-signed. The macOS build is not notarized; use right-click → Open for this preview.
          files: release-assets/*
