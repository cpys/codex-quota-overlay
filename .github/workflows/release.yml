name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ('${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match VERSION=$version"
          }

      - name: Build and test
        shell: pwsh
        run: ./test.ps1

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./package.ps1 -SkipBuild

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/CodexQuotaOverlay-Setup-*.exe
            artifacts/release/CodexQuotaOverlay-Portable-*.zip
            artifacts/release/SHA256SUMS.txt
