name: Bug report
description: Report a reproducible Windows or macOS overlay problem
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, account data, conversation content, screenshots from a managed Mac, paths, settings files, raw App Server responses, or installation UUIDs. A short diagnostic code is sufficient.
  - type: input
    id: overlay-version
    attributes:
      label: Overlay version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex desktop version
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system, architecture, and display scaling
      placeholder: Windows 11 x64 at 150%, or macOS 15 arm64 at 2x
    validations:
      required: true
  - type: input
    id: diagnostic
    attributes:
      label: Short diagnostic code
      description: Use Copy short diagnostics from the tray or menu bar. Do not attach a log file.
      placeholder: E01 | Codex CLI not found
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
